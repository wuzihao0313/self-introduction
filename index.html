<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f0e8">
  <title>ゴ シゴウ | 自己紹介</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202b28;
      --muted: #707b75;
      --green: #31594e;
      --paper: #f4f0e8;
      --line: rgba(32, 43, 40, .12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 24px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 12% 12%, rgba(222, 211, 185, .45), transparent 34%),
        var(--paper);
      color: var(--ink);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    }

    .profile {
      width: min(100%, 1000px);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .8);
      border-radius: 24px;
      background: #fffefa;
      box-shadow: 0 24px 70px rgba(42, 52, 46, .12);
    }

    .intro {
      display: grid;
      grid-template-columns: 1fr .86fr;
      min-height: 510px;
    }

    .intro-copy {
      padding: clamp(36px, 7vw, 76px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .eyebrow {
      margin: 0 0 20px;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .22em;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: clamp(42px, 6vw, 68px);
      font-weight: 500;
      letter-spacing: .04em;
      line-height: 1.15;
    }

    .roman {
      margin: 12px 0 30px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .18em;
    }

    .greeting {
      max-width: 420px;
      margin: 0;
      color: #53605a;
      font-size: 15px;
      line-height: 2.1;
    }

    .portrait {
      min-height: 280px;
      max-height: 420px;
      overflow: hidden;
      background: #dedbd2;
    }

    .portrait img,
    .hobby-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .portrait img {
      object-position: center 38%;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--line);
    }

    .detail {
      padding: 25px 32px 28px;
    }

    .detail + .detail {
      border-left: 1px solid var(--line);
    }

    .detail-label {
      display: block;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
    }

    .detail-value {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.6;
    }

    .interests {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      background: #fffefa;
      color: var(--ink);
    }

    .hobby {
      display: flex;
      align-items: center;
      border-left: 1px solid var(--line);
    }

    .skill {
      display: flex;
      align-items: center;
    }

    .skill-copy {
      flex: 1;
      padding: 28px 24px 28px 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .skill-copy .detail-label {
      margin-bottom: 8px;
      color: var(--green);
    }

    .skill-copy h2 {
      margin: 0 0 6px;
      font-family: Georgia, "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 27px;
      font-weight: 500;
    }

    .skill-copy p:last-child {
      margin: 0;
      color: #53605a;
      font-size: 14px;
      line-height: 1.8;
    }

    .skill-image {
      flex: 0 0 38%;
      max-width: 190px;
      aspect-ratio: 3 / 4;
      margin: 20px 20px 20px 0;
      overflow: hidden;
      border-radius: 12px;
    }

    .skill-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .hobby-copy {
      flex: 1;
      padding: 28px 24px 28px 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hobby .eyebrow {
      margin-bottom: 14px;
      color: var(--green);
    }

    .hobby h2 {
      margin: 0 0 12px;
      font-family: Georgia, "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: clamp(30px, 4vw, 42px);
      font-weight: 500;
      letter-spacing: .08em;
    }

    .hobby-copy p:last-child {
      margin: 0;
      color: #53605a;
      font-size: 14px;
      line-height: 1.9;
    }

    .hobby-image {
      flex: 0 0 38%;
      max-width: 190px;
      aspect-ratio: 3 / 4;
      margin: 20px 20px 20px 0;
      overflow: hidden;
      border-radius: 12px;
    }

    .hobby-image img {
      object-position: center 56%;
    }

    footer {
      padding: 18px 24px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .14em;
      text-align: center;
    }

    @media (max-width: 680px) {
      body {
        padding: 20px 14px;
      }

      .profile {
        border-radius: 18px;
      }

      .intro {
        grid-template-columns: 1fr;
      }

      .intro-copy {
        padding: 42px 30px 36px;
      }

      .portrait {
        min-height: 260px;
        max-height: 360px;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .detail {
        padding: 18px 30px;
      }

      .detail + .detail {
        border-top: 1px solid var(--line);
        border-left: 0;
      }

      .detail-label {
        margin-bottom: 5px;
      }

      .skill-copy {
        padding: 28px 30px 24px;
      }

      .skill,
      .hobby {
        flex-direction: column;
        align-items: stretch;
      }

      .skill-image {
        width: min(100% - 60px, 260px);
        flex-basis: auto;
        margin: 0 auto 26px;
      }

      .hobby-copy {
        padding: 36px 30px 30px;
      }

      .interests {
        grid-template-columns: 1fr;
      }

      .hobby {
        border-top: 1px solid var(--line);
        border-left: 0;
      }

      .hobby-image {
        width: min(100% - 60px, 260px);
        flex-basis: auto;
        margin: 0 auto 26px;
      }
    }
  </style>
</head>
<body>
  <main class="profile">
    <section class="intro" aria-labelledby="profile-name">
      <div class="intro-copy">
        <p class="eyebrow">PROFILE · 自己紹介</p>
        <h1 id="profile-name">R26E2505 ゴ シゴウ</h1>
        <p class="roman">GO SHIGOU</p>
        <p class="greeting">
          はじめまして、ゴ シゴウです。23歳です。<br>
          中国の山東省威海市出身です。<br>
          特技はビリヤードで、趣味はポケモンです。<br>
          どうぞよろしくお願いします。
        </p>
      </div>
      <div class="portrait">
        <img src="./profile.jpg" alt="ゴ シゴウのプロフィール写真" loading="lazy" decoding="async">
      </div>
    </section>

    <section class="details" aria-label="プロフィール詳細">
      <div class="detail">
        <span class="detail-label">NAME · 名前</span>
        <p class="detail-value">R26E2505 ゴ シゴウ</p>
      </div>
      <div class="detail">
        <span class="detail-label">AGE · 年齢</span>
        <p class="detail-value">23歳</p>
      </div>
      <div class="detail">
        <span class="detail-label">FROM · 出身地</span>
        <p class="detail-value">中国・山東省威海市</p>
      </div>
    </section>

    <section class="interests" aria-label="特技と趣味">
      <section class="skill" aria-labelledby="skill-title">
        <div class="skill-copy">
          <span class="detail-label">MY SKILL · 特技</span>
          <h2 id="skill-title">ビリヤード</h2>
          <p>狙いを定めて、正確なショットを目指します。</p>
        </div>
        <div class="skill-image">
          <img src="./billiards.jpg" alt="ビリヤード台と球" loading="lazy" decoding="async">
        </div>
      </section>

      <section class="hobby" aria-labelledby="pokemon-title">
        <div class="hobby-copy">
          <p class="eyebrow">MY HOBBY · 趣味</p>
          <h2 id="pokemon-title">ポケモン</h2>
          <p>ポケモンが好きです。お気に入りのポケモンを見つけるのも楽しみの一つです。</p>
        </div>
        <div class="hobby-image">
          <img src="./pokemon.png" alt="お気に入りのポケモン" loading="lazy" decoding="async">
        </div>
      </section>
    </section>

    <footer>どうぞよろしくお願いします</footer>
  </main>
</body>
</html>
